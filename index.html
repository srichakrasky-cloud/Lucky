<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LuckyPick - Customer Registration</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #18052f, #35106b, #17052b);
    color: white;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: 30px auto;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    font-size: 32px;
    color: #ffd75a;
    letter-spacing: 1px;
}

.logo p {
    color: #d8cbea;
    margin-top: 5px;
    font-size: 14px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,215,90,0.35);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
}

.card h2 {
    text-align: center;
    color: #ffd75a;
    margin-bottom: 22px;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #eee;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #76559e;
    background: rgba(255,255,255,0.10);
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #ffd75a;
}

input::placeholder {
    color: #bcaed0;
}

.save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #ffd75a, #ffb52e);
    color: #241039;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.save-btn:hover {
    transform: translateY(-1px);
}

.message {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    background: rgba(40, 200, 120, 0.15);
    border: 1px solid #42d692;
}

.message h3 {
    color: #63e6a3;
    margin-bottom: 12px;
}

.login-info {
    line-height: 1.9;
    font-size: 14px;
}

.login-info strong {
    color: #ffd75a;
}

.login-btn {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: 1px solid #ffd75a;
    border-radius: 10px;
    background: transparent;
    color: #ffd75a;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: rgba(255,215,90,0.1);
}

.login-section {
    display: none;
}

.error {
    color: #ff8d8d;
    font-size: 13px;
    margin-top: 5px;
}

.note {
    margin-top: 15px;
    text-align: center;
    color: #bcaed0;
    font-size: 12px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>LUCKYPICK</h1>
        <p>Customer Registration</p>
    </div>

    <!-- REGISTRATION -->
    <div class="card" id="registerCard">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label>UPI ID</label>
                <input
                    type="text"
                    id="upi"
                    placeholder="example@upi"
                    required
                >
            </div>

            <div class="form-group">
                <label>Account Number</label>
                <input
                    type="text"
                    id="account"
                    placeholder="Enter account number"
                    required
                >
            </div>

            <div class="form-group">
                <label>IFSC Code</label>
                <input
                    type="text"
                    id="ifsc"
                    placeholder="Enter IFSC code"
                    required
                >
            </div>

            <div class="form-group">
                <label>Create Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create your password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >
                <div class="error" id="passwordError"></div>
            </div>

            <button type="submit" class="save-btn">
                SAVE PROFILE
            </button>

        </form>

        <div class="note">
            Please remember your mobile number and password for login.
        </div>

    </div>


    <!-- SAVED SUCCESS -->
    <div class="card message" id="successCard">

        <h3>✓ Profile Saved Successfully</h3>

        <div class="login-info">

            <div>
                <strong>Customer ID:</strong>
                <span id="customerId"></span>
            </div>

            <div>
                <strong>Mobile Number:</strong>
                <span id="savedMobile"></span>
            </div>

            <div>
                <strong>Password:</strong>
                <span id="savedPassword"></span>
            </div>

        </div>

        <button class="login-btn" onclick="showLogin()">
            GO TO LOGIN
        </button>

    </div>


    <!-- LOGIN -->
    <div class="card login-section" id="loginCard">

        <h2>Customer Login</h2>

        <div class="form-group">
            <label>Mobile Number</label>
            <input
                type="tel"
                id="loginMobile"
                maxlength="10"
                placeholder="Enter mobile number"
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
            >
        </div>

        <div class="error" id="loginError"></div>

        <button class="save-btn" onclick="loginCustomer()">
            LOGIN
        </button>

    </div>

</div>


<script>

let customers =
    JSON.parse(localStorage.getItem("luckyPickCustomers")) || [];


/* REGISTER */

document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const upi =
        document.getElementById("upi").value.trim();

    const account =
        document.getElementById("account").value.trim();

    const ifsc =
        document.getElementById("ifsc").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const passwordError =
        document.getElementById("passwordError");

    passwordError.textContent = "";


    /* MOBILE VALIDATION */

    if (!/^[0-9]{10}$/.test(mobile)) {

        passwordError.textContent =
            "Please enter a valid 10 digit mobile number.";

        return;
    }


    /* PASSWORD MATCH */

    if (password !== confirmPassword) {

        passwordError.textContent =
            "Passwords do not match.";

        return;
    }


    /* CHECK EXISTING MOBILE */

    const existing =
        customers.find(c => c.mobile === mobile);

    if (existing) {

        passwordError.textContent =
            "This mobile number is already registered.";

        return;
    }


    /* CUSTOMER ID */

    const customerId =
        "LP" + Math.floor(10000 + Math.random() * 90000);


    /* CUSTOMER DATA */

    const customer = {

        customerId: customerId,

        name: name,

        mobile: mobile,

        upi: upi,

        account: account,

        ifsc: ifsc,

        password: password,

        createdAt: new Date().toISOString()

    };


    customers.push(customer);

    localStorage.setItem(
        "luckyPickCustomers",
        JSON.stringify(customers)
    );


    /* SHOW LOGIN DETAILS */

    document.getElementById("customerId").textContent =
        customerId;

    document.getElementById("savedMobile").textContent =
        mobile;

    document.getElementById("savedPassword").textContent =
        password;


    document.getElementById("registerCard").style.display =
        "none";

    document.getElementById("successCard").style.display =
        "block";

});


/* SHOW LOGIN */

function showLogin() {

    document.getElementById("successCard").style.display =
        "none";

    document.getElementById("loginCard").style.display =
        "block";


    /* AUTO FILL MOBILE + PASSWORD */

    const mobile =
        document.getElementById("savedMobile").textContent;

    const password =
        document.getElementById("savedPassword").textContent;


    document.getElementById("loginMobile").value =
        mobile;

    document.getElementById("loginPassword").value =
        password;
}


/* LOGIN */

function loginCustomer() {

    const mobile =
        document.getElementById("loginMobile").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const loginError =
        document.getElementById("loginError");


    loginError.textContent = "";


    const customer =
        customers.find(
            c =>
            c.mobile === mobile &&
            c.password === password
        );


    if (!customer) {

        loginError.textContent =
            "Invalid mobile number or password.";

        return;
    }


    /* SAVE LOGGED CUSTOMER */

    localStorage.setItem(
        "loggedCustomer",
        JSON.stringify(customer)
    );


    /*
       TEMPORARY DASHBOARD MESSAGE

       Dashboard code will be connected here.
    */

    alert(
        "Login successful!\n\nWelcome " +
        customer.name
    );

}

</script>

</body>
</html>
