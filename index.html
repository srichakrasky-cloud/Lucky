<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LuckyPick - Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(circle at 15% 15%,rgba(166,76,255,.35),transparent 30%),
    radial-gradient(circle at 85% 85%,rgba(255,205,70,.16),transparent 30%),
    linear-gradient(135deg,#10021f,#260449,#0d0119);

    color:white;
}

.container{
    width:100%;
    max-width:430px;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-box{
    width:70px;
    height:70px;
    margin:0 auto 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:21px;

    background:linear-gradient(145deg,#ffe06a,#ffb52e);

    color:#351052;
    font-size:29px;
    font-weight:900;

    transform:rotate(-3deg);

    box-shadow:
    0 0 28px rgba(255,210,80,.35),
    0 12px 35px rgba(0,0,0,.4);
}

.logo h1{
    font-size:35px;
    letter-spacing:2px;
    font-weight:900;

    background:linear-gradient(90deg,#fff,#ffd75a);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo p{
    margin-top:5px;
    color:#c6b3d9;
    font-size:12px;
    letter-spacing:1px;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 12px;

    border-radius:20px;

    border:1px solid rgba(255,215,90,.35);
    background:rgba(255,215,90,.09);

    color:#ffd75a;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}


/* CARD */

.card{
    padding:29px 26px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.045)
    );

    border:1px solid rgba(255,215,90,.25);

    box-shadow:
    0 25px 70px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
}

.card h2{
    text-align:center;
    font-size:23px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#bca9d0;
    font-size:13px;
    margin-bottom:25px;
}


/* INPUT */

.group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:8px;

    color:#e8deef;
    font-size:13px;
    font-weight:600;
}

.input{
    width:100%;
    height:52px;

    padding:0 15px;

    border-radius:13px;

    border:1px solid rgba(174,127,220,.35);

    background:rgba(18,3,34,.58);

    color:white;

    outline:none;

    font-size:14px;

    transition:.25s;
}

.input:focus{
    border-color:#ffd75a;

    box-shadow:
    0 0 0 3px rgba(255,215,90,.07),
    0 0 20px rgba(255,215,90,.08);
}

.input::placeholder{
    color:#806f91;
}


/* REFERRAL */

.referral-box{
    position:relative;
}

.referral-box .input{
    border-color:rgba(255,215,90,.35);
    background:rgba(255,195,55,.055);
}

.referral-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.demo-text{
    font-size:10px;
    color:#ffd75a;
}


/* REGISTER BUTTON */

.register-btn{
    width:100%;
    height:54px;

    margin-top:5px;

    border:0;
    border-radius:14px;

    background:
    linear-gradient(90deg,#ffd95a,#ffb52e);

    color:#28103b;

    font-size:15px;
    font-weight:900;

    letter-spacing:.6px;

    cursor:pointer;

    box-shadow:
    0 10px 28px rgba(255,185,45,.22);

    transition:.25s;
}

.register-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 15px 35px rgba(255,185,45,.32);
}


/* LOGIN */

.login{
    text-align:center;

    margin-top:22px;
    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.08);

    color:#bca9d0;
    font-size:13px;
}

.login span{
    color:#ffd75a;
    font-weight:bold;
    cursor:pointer;
}


/* MESSAGE */

.message{
    display:none;

    margin-top:18px;
    padding:15px;

    border-radius:12px;

    background:rgba(45,200,120,.10);
    border:1px solid rgba(65,220,145,.3);

    color:#72e8ac;

    text-align:center;

    font-size:13px;
}


/* FOOTER */

.footer{
    text-align:center;
    margin-top:18px;

    color:#75627f;
    font-size:10px;
    line-height:1.5;
}


@media(max-width:480px){

    body{
        padding:15px;
    }

    .logo h1{
        font-size:31px;
    }

    .logo-box{
        width:63px;
        height:63px;
    }

    .card{
        padding:26px 21px;
        border-radius:22px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- LOGO -->

    <div class="logo">

        <div class="logo-box">
            LP
        </div>

        <h1>LUCKYPICK</h1>

        <p>YOUR NUMBER • YOUR CHOICE</p>

        <span class="badge">
            DEMO VERSION
        </span>

    </div>


    <!-- REGISTER CARD -->

    <div class="card">

        <h2>Create Your Account</h2>

        <div class="subtitle">
            Enter your details to get started
        </div>


        <!-- REFERRAL -->

        <div class="group referral-box">

            <div class="referral-label">

                <label>Referral Code</label>

                <span class="demo-text">
                    OPTIONAL
                </span>

            </div>

            <input
                class="input"
                type="text"
                id="referral"
                placeholder="Enter referral code"
                maxlength="20"
            >

        </div>


        <!-- NAME -->

        <div class="group">

            <label>Full Name</label>

            <input
                class="input"
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

        </div>


        <!-- MOBILE -->

        <div class="group">

            <label>Mobile Number</label>

            <input
                class="input"
                type="tel"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10 digit mobile number"
            >

        </div>


        <!-- PASSWORD -->

        <div class="group">

            <label>Create Password</label>

            <input
                class="input"
                type="password"
                id="password"
                placeholder="Create your password"
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="group">

            <label>Confirm Password</label>

            <input
                class="input"
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
            >

        </div>


        <!-- ERROR -->

        <div
            id="error"
            style="
            display:none;
            color:#ff929d;
            background:rgba(255,70,90,.08);
            border:1px solid rgba(255,90,100,.2);
            padding:10px;
            border-radius:10px;
            font-size:12px;
            text-align:center;
            margin-bottom:15px;
            "
        ></div>


        <!-- REGISTER -->

        <button
            class="register-btn"
            onclick="registerCustomer()"
        >
            CREATE ACCOUNT
        </button>


        <!-- LOGIN -->

        <div class="login">

            Already have an account?

            <span onclick="goLogin()">
                Login Here
            </span>

        </div>


        <!-- SUCCESS -->

        <div
            class="message"
            id="success"
        >
            ✓ Account created successfully
        </div>

    </div>


    <div class="footer">

        LuckyPick Demo • Customer Portal<br>
        For demonstration purposes only

    </div>

</div>


<script>

function registerCustomer(){

    const referral =
        document.getElementById("referral").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const error =
        document.getElementById("error");


    error.style.display = "none";


    if(!name || !mobile || !password || !confirmPassword){

        error.textContent =
        "Please fill all required details.";

        error.style.display = "block";

        return;
    }


    if(!/^[0-9]{10}$/.test(mobile)){

        error.textContent =
        "Please enter a valid 10 digit mobile number.";

        error.style.display = "block";

        return;
    }


    if(password.length < 6){

        error.textContent =
        "Password must contain at least 6 characters.";

        error.style.display = "block";

        return;
    }


    if(password !== confirmPassword){

        error.textContent =
        "Passwords do not match.";

        error.style.display = "block";

        return;
    }


    let customers =
    JSON.parse(
        localStorage.getItem("luckyPickCustomers")
    ) || [];


    const existing =
    customers.find(
        customer => customer.mobile === mobile
    );


    if(existing){

        error.textContent =
        "This mobile number is already registered.";

        error.style.display = "block";

        return;
    }


    /* DEMO CUSTOMER ID */

    const customerId =
    "LP" +
    Math.floor(
        10000 + Math.random() * 90000
    );


    const customer = {

        customerId: customerId,

        referralCode: referral,

        name: name,

        mobile: mobile,

        password: password,

        createdAt:
        new Date().toISOString()

    };


    customers.push(customer);


    localStorage.setItem(
        "luckyPickCustomers",
        JSON.stringify(customers)
    );


    document.getElementById("success").style.display =
    "block";


    alert(
        "Registration Successful!\n\n" +
        "Customer ID: " + customerId +
        "\nMobile: " + mobile
    );

}


function goLogin(){

    alert(
        "Login page will be connected here."
    );

}

</script>

</body>
</html>
