<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyPick Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">
        <span>★</span> LuckyPick
    </div>

    <div class="demo-badge">
        DEMO
    </div>
</header>


<main class="container">

    <!-- HERO -->

    <section class="hero">
        <div>
            <p class="small-title">WELCOME TO</p>

            <h1>
                LuckyPick
                <span>Number Game</span>
            </h1>

            <p class="hero-text">
                Create your profile and enter the demo number game.
            </p>
        </div>
    </section>


    <!-- REGISTER -->

    <section class="card">

        <div class="card-title">
            <div class="icon">👤</div>

            <div>
                <h2>Create Profile</h2>
                <p>First-time customers can register here</p>
            </div>
        </div>


        <div class="form-grid">

            <div class="field">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">
            </div>


            <div class="field">
                <label>Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number">
            </div>


            <div class="field">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email">
            </div>


            <div class="field">
                <label>Account Details</label>
                <input
                    type="text"
                    id="account"
                    placeholder="Enter account details">
            </div>


            <div class="field full">
                <label>UPI ID</label>
                <input
                    type="text"
                    id="upi"
                    placeholder="Enter UPI ID">
            </div>

        </div>


        <button class="primary-btn" onclick="saveProfile()">
            SAVE PROFILE
        </button>


        <div id="profileMessage"></div>

    </section>



    <!-- LOGIN -->

    <section class="card">

        <div class="card-title">

            <div class="icon">🔐</div>

            <div>
                <h2>Customer Login</h2>
                <p>Already registered? Login here</p>
            </div>

        </div>


        <div class="form-grid">

            <div class="field">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="loginMobile"
                    placeholder="Mobile number">

            </div>


            <div class="field">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password">

            </div>

        </div>


        <button class="primary-btn" onclick="customerLogin()">
            LOGIN
        </button>


        <div id="loginMessage"></div>

    </section>


</main>


<script>

function generateCustomerId() {

    let number =
        Math.floor(10000 + Math.random() * 90000);

    return "LP" + number;
}


function generatePassword() {

    let chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let password = "";

    for (let i = 0; i < 6; i++) {

        password +=
            chars.charAt(
                Math.floor(Math.random() * chars.length)
            );
    }

    return password;
}


function saveProfile() {

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const account =
        document.getElementById("account").value.trim();

    const upi =
        document.getElementById("upi").value.trim();


    if (!name || !mobile) {

        document.getElementById("profileMessage").innerHTML =
            `<div class="error">
                Please enter your name and mobile number.
             </div>`;

        return;
    }


    let customers =
        JSON.parse(
            localStorage.getItem("customers") || "[]"
        );


    const existing =
        customers.find(c => c.mobile === mobile);


    if (existing) {

        document.getElementById("profileMessage").innerHTML =
            `<div class="error">
                This mobile number is already registered.
             </div>`;

        return;
    }


    const customerId =
        generateCustomerId();

    const password =
        generatePassword();


    const customer = {

        id: customerId,

        name: name,

        mobile: mobile,

        email: email,

        account: account,

        upi: upi,

        password: password,

        createdAt: new Date().toISOString()

    };


    customers.push(customer);


    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );


    document.getElementById("profileMessage").innerHTML =

        `<div class="success">

            <h3>Profile Saved Successfully</h3>

            <p>
                Your customer login details are:
            </p>

            <strong>Customer ID:</strong>
            ${customerId}

            <br>

            <strong>Password:</strong>
            ${password}

            <p class="warning">
                Please keep these details safe.
            </p>

        </div>`;
}



function customerLogin() {

    const mobile =
        document.getElementById("loginMobile").value.trim();

    const password =
        document.getElementById("loginPassword").value.trim();


    let customers =
        JSON.parse(
            localStorage.getItem("customers") || "[]"
        );


    const customer =
        customers.find(
            c =>
                c.mobile === mobile &&
                c.password === password
        );


    if (!customer) {

        document.getElementById("loginMessage").innerHTML =

            `<div class="error">
                Invalid mobile number or password.
             </div>`;

        return;
    }


    localStorage.setItem(
        "loggedCustomer",
        JSON.stringify(customer)
    );


    window.location.href =
        "customer.html";
}

</script>

</body>
</html>
